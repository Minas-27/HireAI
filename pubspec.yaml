name: hire_ai
description: "AI-Powered Interview & Recruitment Platform with Voiceflow and Addis AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP & Networking
  http: ^1.2.0
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # Voice & Audio
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  record: ^6.0.0
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.3.2
  shared_preferences_windows: ^2.4.1
  path_provider: ^2.1.5
  path_provider_windows: ^2.3.0
  
  # UI Enhancements
  animate_do: ^3.3.4
  flutter_spinkit: ^5.2.1
  lottie: ^3.1.3
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  path: ^1.9.0
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android >= 5.0


flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/animations/
